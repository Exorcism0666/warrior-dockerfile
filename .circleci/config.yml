version: 2.1
# AA
jobs:
  run-archiveteam:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker:
          version: docker29
      - run:
          name: "Lancer ArchiveTeam Reddit Grab"
          command: |
            docker run -d --name archiveteam \
              --label=com.centurylinklabs.watchtower.enable=true \
              --restart=unless-stopped \
              atdr.meo.ws/archiveteam/sinavideo-grab \
              --concurrent 6 Exorcism
workflows:
  archive-workflow:
    jobs:
      - run-archiveteam
